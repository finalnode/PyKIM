[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "PyKIM"
version = "0.5.5"
description = "A small, Pyxel-based Python learning environment"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "PyKIM contributors" }]
dependencies = ["certifi>=2024.2.2", "pyxel>=2.2,<3", "PyYAML>=6,<7"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "cryptography>=39,<47",
  "Send2Trash>=1.8,<2",
]
e2e = [
  "pytest>=8",
  "nicegui[native]>=3,<4",
]
guide = [
  "nicegui[native]>=3,<4",
  "cryptography>=39,<47",
  "Send2Trash>=1.8,<2",
  "tomli>=2; python_version < '3.11'",
]
submission = ["cryptography>=39,<47"]
build = [
    "nicegui[native]>=3,<4",
    "cryptography>=39,<47",
    "Send2Trash>=1.8,<2",
    "pillow>=10,<13",
    "pyinstaller>=6,<7",
    "pywebview[gtk]>=5,<7; sys_platform == 'linux'",
    # pythonnet 3.1.0 bündelt zusätzliche .NET-Fassaden, deren Loader auf
    # manchen normalen Windows-Installationen Python.Runtime nicht auflösen kann.
    "pythonnet==3.0.5; sys_platform == 'win32'",
    "tomli>=2; python_version < '3.11'",
]
[project.scripts]
insi = "pykim.guide.app:main"
pykim-guide = "pykim.guide.app:main"
pykim-teacher = "pykim.submission.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pykim = [
  "guide/assets/*.png",
  "guide/content-manifest.json",
  "guide/course_catalog.json",
  "guide/Skripte/imperativ/*.md",
  "guide/Skripte/oop/*.md",
  "guide/Skripte/README.md",
  "guide/Aufgaben/imperativ/*.md",
  "guide/Aufgaben/oop/*.md",
  "guide/Trainer/*.yml",
]

[tool.pytest.ini_options]
addopts = "-ra -m 'not e2e'"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "e2e: browserloser NiceGUI-Gesamtworkflow (explizit mit -m e2e starten)",
  "anyio: asynchroner Test über AnyIO",
  "nicegui_main_file(path): Einstiegspunkt für NiceGUIs User-Simulation",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "PyKIM"
version = "0.5.5"
description = "A small, Pyxel-based Python learning environment"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "PyKIM contributors" }]
dependencies = ["pyxel>=2.2,<3", "PyYAML>=6,<7"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pykim*"]

[tool.pytest.ini_options]
addopts = "-ra -m 'not e2e'"
testpaths = ["tests"]
pythonpath = ["src", "insi/src"]
markers = [
  "e2e: browserloser NiceGUI-Gesamtworkflow (explizit mit -m e2e starten)",
  "anyio: asynchroner Test über AnyIO",
  "nicegui_main_file(path): Einstiegspunkt für NiceGUIs User-Simulation",
]

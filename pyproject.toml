[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "PyKIM"
version = "0.2.0"
description = "A small, Pyxel-based Python learning environment"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "PyKIM contributors" }]
dependencies = ["pyxel>=2.2,<3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = ["pytest>=8"]
guide = [
  "nicegui[native]>=3,<4",
  "cryptography>=39,<47",
  "tomli>=2; python_version < '3.11'",
]
submission = ["cryptography>=39,<47"]

[project.scripts]
pykim-guide = "pykim.guide.app:main"
pykim-teacher = "pykim.submission.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
